name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Initialize test scratch paths
        run: |
          mkdir -p "$RUNNER_TEMP/satin-ci" "$RUNNER_TEMP/satin-consumer"
          echo "SATIN_SCRATCH_ROOT=$RUNNER_TEMP/satin-ci" >> "$GITHUB_ENV"
          echo "SATIN_CONSUMER_EVIDENCE=$RUNNER_TEMP/satin-consumer" >> "$GITHUB_ENV"
          echo "VITEST_MAX_WORKERS=6" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter ./packages/kit build
      - run: pnpm -r typecheck && pnpm -r lint && pnpm build && pnpm -r test
      - run: pnpm test:consumer
